    <link rel="preload" href="images/logo.svg" as="image" type="image/svg+xml"/>

    <link rel="manifest" href="manifest.json"/>
    <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">

<body>
    <canvas id="screen"></canvas>

    <!-- START OF AUTO-FADING TOS DISCLAIMER -->

        <strong>Disclaimer:</strong> Unofficial version. Not affiliated with or sponsored by Kodub or CrazyGames. 
        Original by <a href="https://kodub.com" target="_blank" style="color: #58a6ff; text-decoration: underline;">Kodub</a>. 
        Play official version on <a href="https://crazygames.com" target="_blank" style="color: #58a6ff; text-decoration: underline; font-weight: bold;">CrazyGames</a>.
    </div>

    <script>
        // Wait 8 seconds, smoothly fade out, then remove from view
        setTimeout(function() {
            var disclaimer = document.getElementById('tos-disclaimer');
            if (disclaimer) {
                disclaimer.style.opacity = '0';
                setTimeout(function() {
                    disclaimer.style.display = 'none';
                }, 1500); // Removes element after transition completes
            }
        }, 8000); // 8000 milliseconds = 8 seconds
    </script>
    <!-- END OF AUTO-FADING TOS DISCLAIMER -->
